name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  # only read by "prisma generate"; the tests start their own Postgres and Redis containers
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  verify:
    name: Lint, typecheck, OpenAPI, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Export OpenAPI
        run: pnpm openapi:export
      - name: openapi.json must be committed and up to date
        run: |
          if ! git ls-files --error-unmatch openapi.json > /dev/null 2>&1; then
            echo "openapi.json is not committed: run 'pnpm openapi:export' and commit it"
            exit 1
          fi
          if ! git diff --exit-code -- openapi.json; then
            echo "openapi.json is out of date: run 'pnpm openapi:export' and commit the result"
            exit 1
          fi
      - name: Unit and e2e tests with the coverage gate
        run: pnpm test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  docker:
    name: Build the image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devhire-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
